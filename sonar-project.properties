# Project identification (can be overridden by secrets/env vars)
# sonar.projectKey is typically set via CI secrets

# Source directories (production code only - NOT test code)
sonar.sources=android_embed_sdk/src/main

# Test directories (SonarQube will analyze these differently - no coverage expected)
sonar.tests=android_embed_sdk/src/test,android_embed_sdk/src/androidTest

# Explicitly exclude test files from source analysis
sonar.exclusions=**/src/test/**,**/src/androidTest/**

# Exclude from coverage metrics (belt and suspenders)
sonar.coverage.exclusions=**/test/**,**/androidTest/**,**/*Test.kt,**/*Test.java,**/*Tests.kt,**/*Tests.java

# Exclude test files from duplication detection
sonar.cpd.exclusions=**/test/**,**/androidTest/**

# Source encoding
sonar.sourceEncoding=UTF-8

# JaCoCo coverage report path
sonar.coverage.jacoco.xmlReportPaths=android_embed_sdk/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Kotlin-specific settings
sonar.kotlin.source.version=1.9

